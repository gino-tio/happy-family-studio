name: DB migrations

# Applies new supabase/migrations/studio_*.sql files to the shared Hub Supabase project after they
# reach main (tool/apply_migrations.sh), then runs the shared DB checks.
#
# Setup (once, Gino): Settings → Environments → New environment "hub-db" → Required reviewers:
# gino-tio → add environment secret SUPABASE_ACCESS_TOKEN (Supabase personal access token limited
# to the Tio Hub Project). Every run then waits for Gino's Approve in the Actions tab, so a merged
# PR (by TIO Bot or anyone) cannot change the live DB without him.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/checks.sql'
      - 'tool/apply_migrations.sh'
  workflow_dispatch:

concurrency:
  group: hub-db-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: hub-db
    steps:
      - uses: actions/checkout@v4
      - name: Apply new migrations and run checks
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set in the hub-db environment; nothing applied."
            exit 0
          fi
          tool/apply_migrations.sh
